name: Tiny Factory major-branch validation and deployment

on:
  pull_request:
    branches: [main, 'v[0-9]*.[0-9][0-9]']
  push:
    branches:
      - main
      - 'v[0-9].[0-9][0-9]'

concurrency:
  group: tiny-factory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate Tiny Factory
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned Luau test runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools/luau
          curl --fail --location --retry 3 \
            https://github.com/luau-lang/luau/releases/download/0.737/luau-ubuntu.zip \
            -o .tools/luau.zip
          unzip -q .tools/luau.zip -d .tools/luau
          chmod +x .tools/luau/luau .tools/luau/luau-compile

      - name: Validate reusable 3D GLB sources and manifest
        shell: bash
        run: python3 scripts/import_3d_assets.py --validate-only

      - name: Test Roblox 3D import helpers
        shell: bash
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Compile Luau sources and tests
        shell: bash
        run: |
          set -euo pipefail
          if ! .tools/luau/luau-compile -t1 $(find src tests -name '*.luau' -print) > .tools/luau/compile.log 2>&1; then
            cat .tools/luau/compile.log
            exit 1
          fi

      - name: Run all simulation and rules tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/*.luau; do
            echo "Running $test_file"
            .tools/luau/luau "$test_file"
          done

      - name: Set up Rokit toolchain
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0

      - name: Build and verify Rojo project
        shell: bash
        run: |
          set -euo pipefail
          rojo build default.project.json --output /tmp/TinyFactoryValidation.rbxlx
          test -s /tmp/TinyFactoryValidation.rbxlx
          grep -q "IslandWorldBuilder" /tmp/TinyFactoryValidation.rbxlx
          grep -q "IslandWorldConfig" /tmp/TinyFactoryValidation.rbxlx
          grep -q "LootService" /tmp/TinyFactoryValidation.rbxlx
          grep -q "GlassUI" /tmp/TinyFactoryValidation.rbxlx
          grep -q "HudLayout" /tmp/TinyFactoryValidation.rbxlx

      - name: Validate code-only target mappings
        run: |
          python3 scripts/roblox_cloud_sync.py --check
          python3 scripts/roblox_live_publish.py --check
          python3 -m unittest discover -s tests -p 'test_cloud_live_publish.py'

  sync:
    name: Publish Tiny Factory scripts from main (preserve Studio assets)
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ROBLOX_LIVE_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preflight and publish scripts in the existing place in the selected place
        env:
          ROBLOX_LIVE_PUBLISH_ENABLED: ${{ vars.ROBLOX_LIVE_PUBLISH_ENABLED }}
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ secrets.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ secrets.ROBLOX_PLACE_ID }}
        run: python3 scripts/roblox_live_publish.py --deploy
